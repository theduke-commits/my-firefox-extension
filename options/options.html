<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein KI Assistent</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            width: 320px;
            padding: 15px;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 6px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        p {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        textarea {
            width: 100%;
            height: 60px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 4px;
            color: #f8fafc;
            padding: 8px;
            font-size: 12px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        #vram-status {
            margin: 8px 0 0;
            font-size: 12px;
            color: #94a3b8;
        }
        #vram-status[data-level="ok"] {
            color: #86efac;
        }
        #vram-status[data-level="critical"] {
            color: #fca5a5;
            font-weight: bold;
        }
        #clear-vram-btn {
            margin-top: 6px;
            padding: 5px 8px;
            background-color: #b91c1c;
        }
        #clear-vram-btn:hover {
            background-color: #991b1b;
        }
        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }
        #response-output {
            margin-top: 10px;
            font-size: 11px;
            color: #94a3b8;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="app-title">Mein KI Assistent</h1>
        <p id="welcome-text">Wird geladen...</p>
        <textarea id="user-prompt" placeholder="Schreibe einen Befehl an deine Sandbox..."></textarea>
        <button id="send-btn">Prompt senden</button>
        <p id="vram-status" role="status">VRAM wird geprüft …</p>
        <button id="clear-vram-btn" type="button">🧹 VRAM reinigen</button>
        <div id="response-output" role="status"></div>
    </div>
    <script src="options.js"></script>
</body>
</html>
